<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT WOKS DUDE!</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      background-image: linear-gradient(
        125deg,
        #0f172a,
        #10233f,
        #171438,
        #2a1033,
        #0d2a33,
        #0f172a
      );
      background-size: 400% 400%;
      animation: backdrop-drift 24s ease-in-out infinite alternate;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      margin: 0;
      color: #f8fafc;
      font-size: clamp(2rem, 10vw, 6rem);
      letter-spacing: 0.05em;
      text-align: center;
      text-shadow: 0 0 1.5rem rgba(15, 23, 42, 0.9);
      animation: headline-hues 18s linear infinite;
    }

    /* Le dégradé fait des allers-retours : pas de saut en fin de boucle. */
    @keyframes backdrop-drift {
      from { background-position: 0% 50%; }
      to   { background-position: 100% 50%; }
    }

    /* Teintes toujours très claires : le contraste reste élevé sur le fond sombre. */
    @keyframes headline-hues {
      0%   { color: #f8fafc; }
      17%  { color: #a5f3fc; }
      34%  { color: #c4b5fd; }
      50%  { color: #fbcfe8; }
      67%  { color: #fde68a; }
      84%  { color: #bbf7d0; }
      100% { color: #f8fafc; }
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        background-image: linear-gradient(125deg, #0f172a, #171438);
        background-size: 100% 100%;
        animation: none;
      }
      h1 {
        color: #f8fafc;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <h1>IT WOKS DUDE!</h1>
</body>
</html>
